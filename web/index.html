<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexOS</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --fg: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 15px; margin: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .dot.up { background: var(--green); }
  .dot.down { background: var(--red); }
  .spacer { flex: 1; }
  button, input {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  input { cursor: text; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; padding: 16px; }
  section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow: hidden;
  }
  section h2 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--dim);
    display: flex; align-items: center; gap: 8px;
  }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--dim); font-weight: normal; }
  .dim { color: var(--dim); }
  .ok { color: var(--green); }
  .warn { color: var(--yellow); }
  .err { color: var(--red); }
  #logbox {
    background: #010409; border: 1px solid var(--border); border-radius: 6px;
    height: 280px; overflow-y: auto; padding: 8px; white-space: pre-wrap;
    word-break: break-all; font-size: 12px;
  }
  #execin { width: 100%; padding: 8px; margin-bottom: 8px; }
  #execout {
    background: #010409; border: 1px solid var(--border); border-radius: 6px;
    height: 200px; overflow-y: auto; padding: 8px; white-space: pre-wrap;
    word-break: break-all; font-size: 12px;
  }
  #chatbox {
    background: #010409; border: 1px solid var(--border); border-radius: 6px;
    height: 280px; overflow-y: auto; padding: 8px; font-size: 12px;
    word-break: break-word;
  }
  #chatbox .msg { margin: 0 0 10px; }
  #chatbox .role { font-weight: bold; }
  #chatbox .meta { color: var(--dim); font-size: 11px; margin-bottom: 2px; }
  #chatbox .assistant-text { white-space: pre-wrap; }
  #chatbox .status { color: var(--dim); font-size: 11px; }
  #chatbox .thinking { color: var(--dim); font-size: 11px; margin: 2px 0 6px; }
  #chatbox .thinking summary { cursor: pointer; user-select: none; }
  #chatbox .thinking .assistant-text { white-space: pre-wrap; font-size: 11px; }
  #chatbox .actions { margin: 4px 0; display: grid; gap: 2px; }
  #chatbox .action { font-family: var(--mono, monospace); font-size: 11px; color: var(--dim); }
  #chatlist {
    background: #010409; border: 1px solid var(--border); border-radius: 6px;
    max-height: 140px; overflow-y: auto; padding: 4px; margin-bottom: 8px;
    font-size: 12px;
  }
  #chatlist .empty { color: var(--dim); padding: 6px 8px; }
  .chatitem {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px;
    border-radius: 4px; cursor: pointer;
  }
  .chatitem:hover { background: var(--border); }
  .chatitem.active { background: var(--border); }
  .chatitem .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chatitem .when { color: var(--dim); font-size: 11px; }
  .chatdel {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 12px; padding: 0 2px; line-height: 1;
  }
  .chatdel:hover { color: var(--red); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row .spacer { flex: 1; }
  .metric { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .metric b { text-align: right; }
  #login-overlay {
    position: fixed; inset: 0; background: rgba(13,17,23,0.92);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  #login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; width: 320px; text-align: center;
  }
  #login-card input { width: 100%; margin: 12px 0; }
  .hidden { display: none !important; }
  #settingsform label { display: block; margin-bottom: 8px; }
  #settingsform input[type=number] { width: 80px; }
</style>
</head>
<body>
<header>
  <h1>NexOS</h1>
  <span id="healthdot" class="dot"></span>
  <span class="dim" id="uptime"></span>
  <span class="spacer"></span>
  <span id="authbadge" class="dim hidden">auth</span>
  <button id="refreshbtn">refresh</button>
  <button id="logoutbtn" class="hidden">logout</button>
</header>

<main>
  <section id="status">
    <h2>Services</h2>
    <table id="servicetable">
      <thead><tr><th>name</th><th>state</th><th>pid</th><th>child</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row" style="margin-top:10px">
      <span class="dim">log-proxy</span><span id="dep-logProxy" class="dim">?</span>
      <span class="dim">bridge</span><span id="dep-bridge" class="dim">?</span>
      <span class="dim">git-sign</span><span id="dep-gitSign" class="dim">?</span>
    </div>
  </section>

  <section id="metrics">
    <h2>Metrics</h2>
    <div class="metric" id="metricsbody">loading…</div>
  </section>

  <section id="git-sign" style="grid-column: span 1">
    <h2>Git signing</h2>
    <div id="gitsignbody" class="dim">loading…</div>
  </section>

  <section id="logs">
    <h2>Logs <span class="row" style="display:inline-flex">
      <span class="spacer"></span>
      <span class="dim">auto</span>
      <input type="checkbox" id="autolog" checked>
    </span></h2>
    <div id="logbox"></div>
  </section>

  <section id="exec">
    <h2>Execute</h2>
    <input id="execin" placeholder="command (e.g. ls -la)">
    <div id="execout"></div>
  </section>

  <section id="chat">
    <h2>Assistant
      <span class="row" style="display:inline-flex">
        <span class="spacer"></span>
        <button id="chatnewbtn" type="button">new</button>
        <button id="chatresumebtn" type="button">resume</button>
      </span>
    </h2>
    <div id="chatlist"></div>
    <div id="chatbox"></div>
    <div class="row" style="margin-top:8px">
      <input id="chatinput" placeholder="message the v2 API (streams SSE)" style="flex:1">
      <button class="primary" id="chatsendbtn" type="button">send</button>
    </div>
  </section>

  <section id="settings">
    <h2>Settings</h2>
    <form id="settingsform">
      <label>Log auto-refresh interval (s) <input type="number" id="set-interval" min="1" max="60" value="3"></label>
      <button type="submit">save</button>
    </form>
  </section>
</main>

<div id="login-overlay" class="hidden">
  <div id="login-card">
    <h2>NexOS</h2>
    <p class="dim">Authentication required</p>
    <input type="password" id="tokeninput" placeholder="token" autocomplete="current-password">
    <button class="primary" id="loginbtn">login</button>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
let authRequired = false;
let pollTimer = null;
let refreshInterval = 3;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) {
    showLogin();
    throw new Error('unauthorized');
  }
  return res;
}

function showLogin() { authRequired = true; $('login-overlay').classList.remove('hidden'); }
function hideLogin() { authRequired = false; $('login-overlay').classList.add('hidden'); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadHealth() {
  try {
    const r = await api('/health');
    const h = await r.json();
    $('healthdot').className = 'dot up';
    $('uptime').textContent = 'up ' + h.uptimeSeconds + 's';
    for (const dep of ['logProxy', 'bridge', 'gitSign']) {
      const el = $('dep-' + dep);
      el.textContent = h.dependencies[dep];
      el.className = h.dependencies[dep] === 'up' ? 'ok' : 'err';
    }
    $('authbadge').classList.toggle('hidden', !h.auth);
  } catch {}
}

async function loadStatus() {
  try {
    const r = await api('/api/v1/status');
    const s = await r.json();
    const rows = (s.supervisor || []).map((sv) =>
      '<tr><td>' + esc(sv.name) + '</td><td class="' + (sv.state === 'running' ? 'ok' : 'err') + '">'
      + esc(sv.state) + '</td><td>' + (sv.pid ?? '-') + '</td><td>' + (sv.childPid ?? '-') + '</td></tr>');
    $('servicetable').querySelector('tbody').innerHTML = rows.join('') || '<tr><td colspan=4 class=dim>no supervised services</td></tr>';
  } catch {}
}

async function loadMetrics() {
  try {
    const r = await api('/api/v1/metrics');
    const { metrics: m } = await r.json();
    $('metricsbody').innerHTML =
      'memory <b>' + m.memUsedMB + ' / ' + m.memTotalMB + ' MB (' + m.memUsedPercent + '%)</b>' +
      '<span>cpu</span><b>' + m.cpuUsagePercent + '%</b>' +
      '<span>load</span><b>' + m.loadAvg1m + ' / ' + m.loadAvg5m + ' / ' + m.loadAvg15m + '</b>' +
      '<span>disk</span><b>' + m.diskUsedMB + ' / ' + m.diskTotalMB + ' MB (' + m.diskUsedPercent + '%)</b>' +
      '<span>host</span><b>' + esc(m.hostname) + '</b>';
  } catch {}
}

async function loadGitSign() {
  try {
    const r = await api('/api/v1/git-sign');
    const g = await r.json();
    $('gitsignbody').innerHTML = g.reachable
      ? 'status <b class="ok">up</b><br>pubkey: <code>' + esc(g.pubkey || '(none)') + '</code>'
      : '<span class="warn">not running (configure NEXOS_GIT_SIGN_KEY and start git-sign)</span>';
  } catch {}
}

async function loadLogs() {
  try {
    const r = await api('/api/v1/logs');
    const j = await r.json();
    const lines = (j.logs || []).map((l) =>
      '<span class="dim">' + esc(new Date(l.timestamp).toLocaleTimeString()) + '</span> '
      + '[' + esc(l.stream) + '] ' + esc(l.message));
    const box = $('logbox');
    box.innerHTML = lines.join('\n') || '<span class="dim">no logs</span>';
    box.scrollTop = box.scrollHeight;
  } catch {}
}

async function runExec() {
  const cmd = $('execin').value.trim();
  if (!cmd) return;
  const out = $('execout');
  out.innerHTML = '<span class="dim">$ ' + esc(cmd) + '</span>\n';
  try {
    const r = await api('/api/v1/exec', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd, wait: true }),
    });
    const j = await r.json();
    if (j.error) {
      out.innerHTML += '<span class="err">' + esc(j.error) + '</span>\n';
    } else {
      out.innerHTML += '<span class="' + (j.exitCode === 0 ? 'ok' : 'err') + '">exit ' + (j.exitCode ?? '?') + ' (pid ' + (j.pid ?? '-') + ')</span>\n';
    }
  } catch (e) {
    out.innerHTML += '<span class="err">' + esc(e.message) + '</span>\n';
  }
}

async function loadSettings() {
  try {
    const r = await api('/api/v1/settings');
    const j = await r.json();
    if (j.settings && j.settings.logInterval) {
      refreshInterval = j.settings.logInterval;
      $('set-interval').value = refreshInterval;
    }
  } catch {}
}

async function saveSettings() {
  refreshInterval = parseInt($('set-interval').value, 10) || 3;
  const r = await api('/api/v1/settings', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ settings: { logInterval: refreshInterval } }),
  });
  if (r.ok) schedulePoll();
}

function schedulePoll() {
  clearInterval(pollTimer);
  if ($('autolog').checked) {
    pollTimer = setInterval(() => loadLogs(), refreshInterval * 1000);
  }
}

$('refreshbtn').addEventListener('click', () => { loadHealth(); loadStatus(); loadMetrics(); loadGitSign(); loadLogs(); });
$('autolog').addEventListener('change', schedulePoll);
$('execin').addEventListener('keydown', (e) => { if (e.key === 'Enter') runExec(); });
$('settingsform').addEventListener('submit', (e) => { e.preventDefault(); saveSettings(); });
$('loginbtn').addEventListener('click', async () => {
  const token = $('tokeninput').value;
  const r = await api('/api/v1/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token }),
  });
  if (r.ok) { hideLogin(); loadHealth(); loadStatus(); loadMetrics(); loadGitSign(); loadLogs(); }
});
$('logoutbtn').addEventListener('click', async () => {
  await api('/api/v1/logout', { method: 'POST' });
  showLogin();
});

// --- assistant (v2 chat SSE, incremental renderer from chat/chunks.mjs) ---
let chatId = null;
let chatBusy = false;
let chatAssistantEl = null;
let chatRender = null; // { reducer, textEls, thinkingEl, actionEl, actionRows }

function chatLine(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  return d;
}

function chatAppend(el) {
  const box = $('chatbox');
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function chatStatus(text) {
  chatAppend(chatLine('status', '<span class="meta">' + esc(text) + '</span>'));
}

function chatStartAssistant() {
  chatAssistantEl = chatLine('assistant', '');
  chatAssistantEl.appendChild(Object.assign(document.createElement('div'), { className: 'role', textContent: 'assistant' }));
  chatAppend(chatAssistantEl);
}

function chatActionSummary(data) {
  if (!data) return '';
  if (data.command) return ': $ ' + esc(data.command);
  if (data.operation) return ': ' + esc(data.path) + (data.toPath ? ' → ' + esc(data.toPath) : '');
  if (data.name) return ': ' + esc(data.name);
  if (data.paths) return ': ' + esc(data.paths.join(', '));
  if (data.query) return ': ' + esc(data.query);
  if (data.summary) return ': ' + esc(data.summary);
  return '';
}

function chatRenderChunk(chunk) {
  const r = chatRender;
  if (!r) return;
  const t = chunk.type;
  if (t === 'start' || t === 'finish') return;
  if (t === 'text-start' || t === 'text-delta' || t === 'text-end') {
    let rec = r.textEls.get(chunk.id);
    if (!rec) {
      rec = Object.assign(document.createElement('div'), { className: 'assistant-text', textContent: '' });
      chatAssistantEl.appendChild(rec);
      r.textEls.set(chunk.id, rec);
    }
    if (t !== 'text-end' && chunk.delta) rec.textContent += chunk.delta;
    return;
  }
  if (t === 'reasoning-start' || t === 'reasoning-delta' || t === 'reasoning-end') {
    if (!r.thinkingEl) {
      r.thinkingEl = document.createElement('details');
      r.thinkingEl.className = 'thinking';
      const summary = document.createElement('summary');
      summary.textContent = 'thinking';
      const body = document.createElement('div');
      body.className = 'assistant-text';
      r.thinkingEl._acc = body;
      r.thinkingEl.appendChild(summary);
      r.thinkingEl.appendChild(body);
      chatAssistantEl.appendChild(r.thinkingEl);
    }
    if (t !== 'reasoning-end' && chunk.delta) r.thinkingEl._acc.textContent += chunk.delta;
    return;
  }
  if (t.startsWith('data-v0-')) {
    if (!r.actionEl) {
      r.actionEl = document.createElement('div');
      r.actionEl.className = 'actions';
      chatAssistantEl.appendChild(r.actionEl);
    }
    let row = r.actionRows.get(chunk.id);
    if (!row) {
      row = document.createElement('div');
      row.className = 'action';
      r.actionRows.set(chunk.id, row);
      r.actionEl.appendChild(row);
    }
    row.textContent = '• ' + t.slice('data-v0-'.length).replace('-', ' ') + chatActionSummary(chunk.data);
    return;
  }
}

function appendUserMessage(text) {
  const el = chatLine('user', '');
  el.appendChild(Object.assign(document.createElement('div'), { className: 'role', textContent: 'user' }));
  el.appendChild(Object.assign(document.createElement('div'), { className: 'assistant-text', textContent: text }));
  chatAppend(el);
}

function handleChatEvent(ev, payload) {
  if (!payload) return;
  if (ev === 'update') {
    const evt = payload.event || {};
    if (evt.object === 'chat' && payload.chat && payload.chat.id && payload.chat.id !== chatId) {
      chatId = payload.chat.id;
      chatActiveId = chatId;
      chatHighlight(chatId);
      chatStatus('chat ' + chatId.slice(0, 8) + '… ready');
    }
    if (chatRender) {
      for (const chunk of chatRender.reducer.push(payload)) chatRenderChunk(chunk);
      $('chatbox').scrollTop = $('chatbox').scrollHeight;
    }
    return;
  }
  if (ev === 'done') {
    if (chatRender) {
      for (const chunk of chatRender.reducer.push(payload, true)) chatRenderChunk(chunk);
    }
    chatStatus('done');
    chatAssistantEl = null;
    chatRender = null;
    return;
  }
  if (ev === 'error') {
    chatStatus('error: ' + (payload.error ? (payload.error.message || payload.error) : 'unknown'));
  }
}

async function chatStream(path, body) {
  chatBusy = true;
  $('chatsendbtn').disabled = true;
  $('chatresumebtn').disabled = true;
  chatStartAssistant();
  const { V0SnapshotChunkReducer } = await import('./chat-chunks.mjs');
  chatRender = {
    reducer: new V0SnapshotChunkReducer(),
    textEls: new Map(),
    thinkingEl: null,
    actionEl: null,
    actionRows: new Map(),
  };
  try {
    const res = await api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok || !res.body) {
      const j = await res.json().catch(() => ({}));
      chatStatus('error ' + res.status + ': ' + (j.error || res.statusText));
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let ev = 'message';
        const data = [];
        for (const line of chunk.split('\n')) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) data.push(line.slice(5).trim());
        }
        let payload = null;
        if (data.length) { try { payload = JSON.parse(data.join('\n')); } catch {} }
        handleChatEvent(ev, payload);
      }
    }
  } catch (e) {
    chatStatus('error: ' + e.message);
  } finally {
    chatBusy = false;
    $('chatsendbtn').disabled = false;
    $('chatresumebtn').disabled = false;
    chatRefreshList();
  }
}

// --- chat history sidebar -------------------------------------------------
let chatActiveId = null;
let chatLoading = false;

function chatTextOf(msg) {
  if (!msg.parts || !msg.parts.length) return msg.content || '';
  return msg.parts
    .filter((p) => p.type === 'text')
    .map((p) => p.text || '')
    .join('\n');
}

function chatHighlight(id) {
  for (const el of document.querySelectorAll('#chatlist .chatitem')) {
    el.classList.toggle('active', el.dataset.chatId === id);
  }
}

function chatOpen(id) {
  if (chatBusy || chatLoading || chatActiveId === id) return;
  chatLoading = true;
  chatActiveId = id;
  chatId = id;
  $('chatbox').innerHTML = '';
  chatStatus('loading chat ' + id.slice(0, 8) + '…');
  api('/api/v1/chats/' + encodeURIComponent(id) + '/messages', { method: 'GET' })
    .then((res) => res.json())
    .then((j) => {
      const msgs = (j && j.messages) || [];
      if (!Array.isArray(j.messages)) throw new Error('bad payload');
      if (chatBusy || chatActiveId !== id) return;
      $('chatbox').innerHTML = '';
      for (const m of msgs) {
        const el = chatLine(m.role === 'user' ? 'user' : 'assistant', '');
        el.appendChild(Object.assign(document.createElement('div'), { className: 'role', textContent: m.role }));
        if (m.role === 'user') {
          el.appendChild(Object.assign(document.createElement('div'), { className: 'assistant-text', textContent: m.content || '' }));
        } else {
          const text = chatTextOf(m);
          if (text) el.appendChild(Object.assign(document.createElement('div'), { className: 'assistant-text', textContent: text }));
          const actions = (m.parts || []).filter((p) => typeof p.type === 'string' && p.type.startsWith('data-v0-'));
          if (actions.length) {
            const wrap = document.createElement('div');
            wrap.className = 'actions';
            for (const a of actions) {
              const row = document.createElement('div');
              row.className = 'action';
              row.textContent = '• ' + a.type.slice('data-v0-'.length).replace('-', ' ') + chatActionSummary(a.data);
              wrap.appendChild(row);
            }
            el.appendChild(wrap);
          }
        }
        chatAppend(el);
      }
      chatStatus('chat ' + id.slice(0, 8) + '… open (' + msgs.length + ' messages)');
      chatHighlight(id);
    })
    .catch((e) => {
      chatActiveId = null;
      chatStatus('error: ' + e.message);
      chatHighlight(null);
    })
    .finally(() => { chatLoading = false; });
}

function chatItemEl(chat) {
  const item = document.createElement('div');
  item.className = 'chatitem';
  item.dataset.chatId = chat.id;
  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = chat.title || '(untitled)';
  const when = document.createElement('span');
  when.className = 'when';
  const dt = chat.updatedAt ? new Date(chat.updatedAt) : null;
  when.textContent = dt && !isNaN(dt.getTime()) ? dt.toLocaleString() : '';
  const del = document.createElement('button');
  del.className = 'chatdel';
  del.textContent = '✕';
  del.title = 'delete chat';
  del.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (!confirm('Delete this chat?')) return;
    api('/api/v1/chats/' + encodeURIComponent(chat.id), { method: 'DELETE' })
      .then((res) => {
        if (!res.ok) throw new Error('delete failed ' + res.status);
        if (chatActiveId === chat.id) {
          chatId = null;
          chatActiveId = null;
          $('chatbox').innerHTML = '';
          chatStatus('chat deleted');
        }
        chatRefreshList();
      })
      .catch((e) => chatStatus('error: ' + e.message));
  });
  item.appendChild(title);
  item.appendChild(when);
  item.appendChild(del);
  item.addEventListener('click', () => chatOpen(chat.id));
  return item;
}

async function chatRefreshList() {
  const listEl = $('chatlist');
  listEl.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty';
  try {
    const res = await api('/api/v1/chats?limit=50', { method: 'GET' });
    const j = await res.json();
    const chats = (j && j.chats) || [];
    if (!chats.length) {
      empty.textContent = 'no saved chats yet';
      listEl.appendChild(empty);
      return;
    }
    for (const c of chats) listEl.appendChild(chatItemEl(c));
    chatHighlight(chatActiveId);
  } catch (e) {
    empty.textContent = 'chat history unavailable';
    listEl.appendChild(empty);
  }
}

$('chatsendbtn').addEventListener('click', () => {
  const message = $('chatinput').value;
  if (!message.trim() || chatBusy) return;
  $('chatinput').value = '';
  appendUserMessage(message);
  chatStream('/api/v1/chat/stream', { message, chatId: chatId || undefined });
});
$('chatinput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('chatsendbtn').click(); });
$('chatnewbtn').addEventListener('click', () => {
  if (chatBusy) return;
  chatId = null;
  chatActiveId = null;
  $('chatbox').innerHTML = '';
  chatHighlight(null);
  chatStatus('new chat (chatId cleared)');
});
$('chatresumebtn').addEventListener('click', () => {
  if (chatBusy || !chatId) return;
  chatStream('/api/v1/chat/resume', null);
});

(async function init() {
  hideLogin();
  await loadHealth();
  if (authRequired) return;
  await Promise.all([loadStatus(), loadMetrics(), loadGitSign(), loadLogs(), loadSettings(), chatRefreshList()]);
  schedulePoll();
})();
</script>
</body>
</html>
