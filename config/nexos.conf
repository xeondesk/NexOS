# NexOS configuration
#
# All values may be overridden via environment variables (NEXOS_*).
# This file is sourced by bash components and read by node components
# at startup; keep it shell-parseable.

# Root of the NexOS installation (derived from script location if unset).
NEXOS_ROOT="${NEXOS_ROOT:-}"

# Paths under which services write logs, pidfiles, locks.
NEXOS_LOG_DIR="${NEXOS_LOG_DIR:-$NEXOS_ROOT/state/logs}"
NEXOS_RUN_DIR="${NEXOS_RUN_DIR:-$NEXOS_ROOT/state/run}"

# Persistence for editor config and user data.
NEXOS_STATE_DIR="${NEXOS_STATE_DIR:-$NEXOS_ROOT/state}"
NEXOS_CONFIG_DIR="${NEXOS_CONFIG_DIR:-$NEXOS_ROOT/state/config}"
NEXOS_USER_DATA_DIR="${NEXOS_USER_DATA_DIR:-$NEXOS_ROOT/state/user-data}"

# Web platform portal persistence (web/api-server.js). Atomic JSON snapshot of
# web state (dashboard settings, sessions) restored on boot.
NEXOS_WEB_STATE_FILE="${NEXOS_WEB_STATE_FILE:-$NEXOS_STATE_DIR/web-state.json}"

# v0-compatible API gateway persistence (api/api-server.mjs). Chat/message
# state, mcp-servers, webhooks, preview-hosts + webhook delivery log (Phase 3).
NEXOS_API_STATE_DIR="${NEXOS_API_STATE_DIR:-$NEXOS_STATE_DIR/api}"

# Workspace (the directory services open / run in).
NEXOS_WORKSPACE="${NEXOS_WORKSPACE:-$NEXOS_ROOT/workspace}"

# Service ports.
NEXOS_EDITOR_PORT="${NEXOS_EDITOR_PORT:-4444}"
NEXOS_TERMINAL_PORT="${NEXOS_TERMINAL_PORT:-7681}"
NEXOS_LOG_PROXY_PORT="${NEXOS_LOG_PROXY_PORT:-7682}"
NEXOS_BRIDGE_PORT="${NEXOS_BRIDGE_PORT:-9876}"
NEXOS_BRIDGE_HOST="${NEXOS_BRIDGE_HOST:-127.0.0.1}"
NEXOS_WEB_PORT="${NEXOS_WEB_PORT:-8080}"
NEXOS_WEB_HOST="${NEXOS_WEB_HOST:-127.0.0.1}"
NEXOS_API_PORT="${NEXOS_API_PORT:-8081}"
NEXOS_API_HOST="${NEXOS_API_HOST:-127.0.0.1}"

# Preview ingress (chats.getPreview). Separate origin from the API gateway;
# loopback by default, 0.0.0.0 when NEXOS_ALLOW_REMOTE=true. The default
# upstream is the built-in mock file server; point NEXOS_PREVIEW_UPSTREAM at a
# real dev server (next/vite) to preview real builds.
NEXOS_PREVIEW_PORT="${NEXOS_PREVIEW_PORT:-8082}"
NEXOS_PREVIEW_HOST="${NEXOS_PREVIEW_HOST:-}"
NEXOS_PREVIEW_UPSTREAM="${NEXOS_PREVIEW_UPSTREAM:-http://127.0.0.1:${NEXOS_PREVIEW_PORT}/_upstream}"
NEXOS_API_PREVIEW_SECRET="${NEXOS_API_PREVIEW_SECRET:-nexos-preview-token}"

# Control-plane reachability. Default is strict loopback-only: the log-proxy
# rejects non-loopback clients with 403 and the bridge binds 127.0.0.1. Set to
# "true" to accept remote clients (e.g. when publishing ports via Docker).
NEXOS_ALLOW_REMOTE="${NEXOS_ALLOW_REMOTE:-false}"

# Optional bearer token for remote control-plane clients. Loopback requests
# need no token; non-loopback requests must present it (Authorization: Bearer
# <token>, or ?token= for WebSocket clients) once NEXOS_ALLOW_REMOTE=true.
NEXOS_LOG_PROXY_TOKEN="${NEXOS_LOG_PROXY_TOKEN:-}"
NEXOS_BRIDGE_TOKEN="${NEXOS_BRIDGE_TOKEN:-}"
NEXOS_WEB_TOKEN="${NEXOS_WEB_TOKEN:-}"

# Optional bearer token for remote v2 API clients (api/api-server.mjs). The SDK
# sends it as `Authorization: Bearer <key>`; loopback requests need no token.
NEXOS_API_TOKEN="${NEXOS_API_TOKEN:-}"

# Metrics + callback (client-side identity for the control plane).
NEXOS_ENV_FILE="${NEXOS_ENV_FILE:-$NEXOS_ROOT/config/nexos.env}"
NEXOS_CALLBACK_URL="${NEXOS_CALLBACK_URL:-}"
NEXOS_CALLBACK_TOKEN="${NEXOS_CALLBACK_TOKEN:-}"
NEXOS_CALLBACK_DEPLOYMENT_TARGET="${NEXOS_CALLBACK_DEPLOYMENT_TARGET:-}"

# Framework runtime hooks (see lib/register.mjs).
# JSON array of dev host origins allowed past the framework dev-server gate.
NEXOS_ALLOWED_DEV_HOSTS="${NEXOS_ALLOWED_DEV_HOSTS:-[\"*.nexos.build\",\"*.nexos.run\",\"*.nexos.net\"]}"

# Git signing proxy endpoint (see git/ssh-sign.sh). Point this at the bundled
# reference sign service (git/sign-server.js, supervised as `git-sign`) instead
# of the legacy v0 endpoint: NEXOS_GIT_SIGN_URL=http://127.0.0.1:${NEXOS_GIT_SIGN_PORT}/sign
NEXOS_GIT_SIGN_URL="${NEXOS_GIT_SIGN_URL:-https://git-sign.v0.app/sign}"

# Reference git-sign service (git/sign-server.js). Requires a key to start;
# generate one with `nexos sign-keygen`.
NEXOS_GIT_SIGN_HOST="${NEXOS_GIT_SIGN_HOST:-127.0.0.1}"
NEXOS_GIT_SIGN_PORT="${NEXOS_GIT_SIGN_PORT:-9877}"
NEXOS_GIT_SIGN_KEY="${NEXOS_GIT_SIGN_KEY:-}"
NEXOS_GIT_SIGN_KEY_PEM="${NEXOS_GIT_SIGN_KEY_PEM:-}"
NEXOS_GIT_SIGN_TOKEN="${NEXOS_GIT_SIGN_TOKEN:-}"
NEXOS_GIT_SIGN_HASHALG="${NEXOS_GIT_SIGN_HASHALG:-sha512}"

# Max supervised log size before truncation (bytes).
NEXOS_SUPERVISE_MAX_LOG_BYTES="${NEXOS_SUPERVISE_MAX_LOG_BYTES:-10485760}"
