# NexOS development environment — ready-to-run deployment.
#
#   docker compose up -d
#   open http://localhost:4444   (VS Code web)
#   open http://localhost:7681   (web terminal)
#   open http://localhost:8080   (web portal dashboard)
#   curl  http://localhost:7682/health   (control plane)
#   curl  http://localhost:8081/health   (v2 API gateway)

services:
  nexos:
    build:
      context: .
    image: nexos:latest
    container_name: nexos
    restart: unless-stopped
    ports:
      - "4444:4444"   # code-server editor
      - "7681:7681"   # ttyd terminal
      - "7682:7682"   # log-proxy control plane
      - "9876:9876"   # bridge API (localhost-only by default)
      - "8080:8080"   # web portal dashboard
      - "8081:8081"   # v2 API gateway (SDK baseUrl: http://host:8081/v2)
    volumes:
      - ./workspace:/workspace            # your code lives here
      - nexos-state:/opt/nexos/state      # logs, pidfiles, editor config
      # mount identity without baking it into the image:
      # - ./nexos.env:/opt/nexos/config/nexos.env:ro
    environment:
      - NEXOS_EDITOR_PORT=4444
      - NEXOS_TERMINAL_PORT=7681
      - NEXOS_LOG_PROXY_PORT=7682
      - NEXOS_BRIDGE_PORT=9876
      - NEXOS_WEB_PORT=8080
      - NEXOS_API_PORT=8081
      # Auth for the web portal. Loopback is always trusted; set a token to
      # gate non-loopback dashboard requests (login screen / bearer header):
      # - NEXOS_WEB_TOKEN=changeme
      # Control-plane reachability. Default (loopback-only) means the ports
      # published above serve nothing: docker-proxy arrives from a non-loopback
      # address and the log-proxy answers 403 / the bridge stays on 127.0.0.1.
      # Uncomment to make the control plane reachable through the published
      # ports (required for remote IDE hosts / proxied access):
      # - NEXOS_ALLOW_REMOTE=true
      # When remote access is on, require a bearer token for the control
      # plane (loopback stays token-free):
      # - NEXOS_LOG_PROXY_TOKEN=changeme
      # - NEXOS_BRIDGE_TOKEN=changeme
      # Service gating (defaults: log-proxy on; editor/terminal on if the
      # binary exists; bridge on; metrics on if a callback URL is configured):
      # - NEXOS_ENABLE_EDITOR=true
      # - NEXOS_ENABLE_TERMINAL=true
      # - NEXOS_ENABLE_BRIDGE=false
      # - NEXOS_ENABLE_METRICS=false
      # Callback identity (metrics + sync events):
      # - NEXOS_CALLBACK_URL=
      # - NEXOS_CALLBACK_TOKEN=
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7682/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

volumes:
  nexos-state:
